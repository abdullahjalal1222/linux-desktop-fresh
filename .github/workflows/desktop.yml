name: Desktop

on:
  # dispatch-only: a stray push cannot (re)start a desktop session
  workflow_dispatch:
    inputs:
      keep-alive:
        description: 'Keep the 6-hour chain running (uncheck to stop after this session)'
        type: boolean
        default: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    # Fresh mode: no snapshots and no state cache. The runner stays busy with
    # a health-checked heartbeat for ~5 h, then the handover step chains the
    # next fresh session. The renewer (armed at start) and the watchdog cron
    # are the safety nets.
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
    env:
      UID_NUM: '911'
      GID_NUM: '911'
    steps:
      - name: Start Docker
        run: |
          mkdir -p config
          {
            echo "=== THIS RUN: ${{ github.run_id }} ==="
            echo "KEEP-ALIVE: ${{ inputs.keep-alive }}"
            echo "STATE: FRESH (no saved state available - nothing is restored)"
            echo "MARKER-FROM-PREV-RUN: NONE"
            echo "DESKTOP-FROM-PREV-RUN: NONE"
          } | tee /tmp/status.txt
          docker run -d \
            --name webtop \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -v "$PWD/config:/config" \
            -e CUSTOM_USER=admin \
            -e PUID=$UID_NUM \
            -e PGID=$GID_NUM \
            -e PASSWORD="${{ secrets.WEBTOP_PASSWORD }}" \
            ghcr.io/linuxserver/webtop
          sleep 80
          docker exec webtop sh -c 'pgrep -x xfce4-session >/dev/null && echo "XFCE-SESSION: RUNNING" || echo "XFCE-SESSION: DEAD"' | tee -a /tmp/status.txt || true

      - name: Install cloudflared (retried)
        run: |
          SRC="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          OK=0
          for i in 1 2 3 4 5; do
            if curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/cloudflared "$SRC"; then
              OK=1
              break
            fi
            echo "download failed (attempt $i) - retrying in 20 s"
            sleep 20
          done
          [ "$OK" = 1 ] || { echo "::error::could not download cloudflared after retries"; exit 1; }
          sudo install /tmp/cloudflared /usr/local/bin/cloudflared
          /usr/local/bin/cloudflared --version

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "::error::no tunnel URL"; exit 1; }
          echo "$URL" > /tmp/url.txt
          tail -n +2 /tmp/status.txt >> /tmp/url.txt
          { cat /tmp/status.txt; echo "(URL withheld - see tunnel-url artifact)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Email login details
        if: always()
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          WEBTOP_PASSWORD: ${{ secrets.WEBTOP_PASSWORD }}
        run: |
          URL="$(head -1 /tmp/url.txt 2>/dev/null || true)"
          {
            echo "URL=$URL"
            echo "MAIL_TO=$MAIL_TO"
            echo "MAIL_FROM=$MAIL_FROM"
            echo "KEY_PRESENT=$([ -n "$RESEND_KEY" ] && echo yes || echo no)"
            if [ -z "$RESEND_KEY" ]; then
              echo "RESULT=SKIPPED-no-key"
            else
              DOMAIN="${URL#https://}"; DOMAIN="${DOMAIN%%/*}"
              UTC_NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
              IRQ_NOW=$(date -u -d '+3 hours' '+%Y-%m-%d %H:%M:%S Baghdad')
              SUBJECT="Linux Desktop ready - $DOMAIN - $UTC_NOW"
              PAYLOAD=$(jq -nc --arg f "$MAIL_FROM" --arg to "$MAIL_TO" --arg s "$SUBJECT" --arg u "$URL" --arg p "$WEBTOP_PASSWORD" --arg utc "$UTC_NOW" --arg irq "$IRQ_NOW" \
                '{from:$f, to:[$to], subject:$s,
                  text:("Linux Desktop is ready.\n\nURL: "+$u+"\nUsername: admin\nPassword: "+$p+"\n\nSession started: "+$utc+"  ("+$irq+")\n"),
                  html:("<html><body style=\"font-family:Arial;background:#f4f5f7;padding:24px\"><div style=\"max-width:560px;margin:auto;background:#fff;border-radius:12px;overflow:hidden\"><div style=\"background:#2563eb;padding:20px;color:#fff;font-size:19px\">Linux Desktop ready</div><div style=\"padding:24px\"><p style=\"color:#666;font-size:13px;margin:0 0 6px\">URL</p><p style=\"margin:0 0 18px;font-size:15px\"><a href=\""+$u+"\">"+$u+"</a></p><p style=\"color:#666;font-size:13px;margin:0 0 6px\">Username</p><p style=\"margin:0 0 18px;font-family:monospace;font-size:16px;background:#f1f5f9;padding:8px 12px;border-radius:6px\">admin</p><p style=\"color:#666;font-size:13px;margin:0 0 6px\">Password</p><p style=\"margin:0 0 18px;font-family:monospace;font-size:16px;background:#f1f5f9;padding:8px 12px;border-radius:6px\">"+$p+"</p><p style=\"color:#666;font-size:13px;margin:0\">Started "+$utc+" ("+$irq+")</p></div></div></body></html>")}')
              CODE=000
              for attempt in 1 2 3; do
                CODE=$(curl -s -o /tmp/res.json -w '%{http_code}' -X POST https://api.resend.com/emails \
                  -H "Authorization: Bearer $RESEND_KEY" -H "Content-Type: application/json" -d "$PAYLOAD")
                echo "ATTEMPT=$attempt HTTP=$CODE"
                if [ "$CODE" = "200" ]; then break; fi
                sleep 15
              done
              echo "HTTP=$CODE"
              echo "BODY=$(head -c 400 /tmp/res.json)"
              if [ "$CODE" = "200" ]; then echo "RESULT=SENT"; else echo "RESULT=FAILED"; fi
            fi
          } > /tmp/email-status.txt
          # SECURITY: never tee this to stdout - the job log of a PUBLIC repo is
          # world-readable for completed runs, which would leak the live URL.
          grep -v '^URL=' /tmp/email-status.txt | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail loudly. A green 'Email login details' step must mean the mail
          # was actually accepted by Resend, not merely attempted.
          if ! grep -q '^RESULT=SENT$' /tmp/email-status.txt; then
            echo "::error::the login email was NOT sent - see the status above"
            exit 1
          fi

      

      - name: Push login details to ntfy (second channel)
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBTOP_PASSWORD: ${{ secrets.WEBTOP_PASSWORD }}
        run: |
          URL="$(head -1 /tmp/url.txt 2>/dev/null || true)"
          {
            echo "NTFY_HOST=https://ntfy.sh"
            echo "NTFY_PRESENT=$([ -n "$NTFY_TOPIC" ] && echo yes || echo no)"
            if [ -z "$NTFY_TOPIC" ] || [ -z "$URL" ]; then
              echo "PUSH=SKIPPED"
            else
              UTC_NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
              IRQ_NOW=$(date -u -d '+3 hours' '+%Y-%m-%d %H:%M:%S Baghdad')
              MSG=$(printf 'URL: %s\nUsername: admin\nPassword: %s\nStarted: %s  (%s)' \
                "$URL" "$WEBTOP_PASSWORD" "$UTC_NOW" "$IRQ_NOW")
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://ntfy.sh/$NTFY_TOPIC" \
                -H "Title: Desktop 2 ready" -H "Priority: high" --data-binary "$MSG")
              echo "PUSH=$CODE"
              if [ "$CODE" != "200" ]; then
                echo "::warning::ntfy push did not return 200 (HTTP $CODE)"
              fi
            fi
          } > /tmp/push-status.txt 2>&1
          grep -E '^(NTFY_HOST|NTFY_PRESENT|PUSH)' /tmp/push-status.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload email status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-status
          path: /tmp/email-status.txt
          retention-days: 7

      - name: Arm the renewer (safety net)
        # The renewer MUST be armed here, at the START of the session, not in
        # the last step. The last step never runs: the job is killed by its own
        # timeout first, which is what caused 25..52 minutes of dead time
        # between sessions and no renewal email.
        if: ${{ always() && (inputs.keep-alive != 'false') }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'renew.yml',
              ref: context.ref,
              inputs: {
                watch_run: String(${{ github.run_id }}),
                keep_alive: String(${{ inputs.keep-alive }})
              }
            });
            core.info('Renewer armed for run ' + '${{ github.run_id }}');

      - name: Chain summary
        if: always()
        run: |
          {
            echo "### Chain status (fresh mode)"
            echo ""
            echo "- session run id: ${{ github.run_id }}"
            echo "- keep-alive: ${{ inputs.keep-alive }}"
            echo "- state saving: DISABLED - nothing is persisted, every session starts natural"
            echo "- renewer armed at session start; handover chains the next session"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the session alive (fresh mode - nothing is saved)
        if: always()
        timeout-minutes: 320
        run: |
          URL="$(head -1 /tmp/url.txt 2>/dev/null || true)"
          if [ -z "$URL" ]; then
            echo "::error::no tunnel URL available - ending early so a fresh session takes over"
            exit 1
          fi
          echo "tunnel: $URL"
          echo "Fresh mode: this session is not saved. All changes made here
          disappear when it ends - the next session starts brand new."
          echo "Heartbeat every 5 minutes; after ~60 cycles the handover step
          chains the next fresh session. Three consecutive failed desktop
          checks fail the step early so a fresh session starts sooner."
          FAILS=0
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://localhost:3000 || true)
            echo "alive: cycle=$i http=$CODE $(date -u '+%H:%M:%S UTC')"
            if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
              FAILS=0
            else
              FAILS=$((FAILS+1))
              if [ "$FAILS" -ge 3 ]; then
                echo "::error::desktop stopped answering on localhost:3000 (3 in a row) - ending early for a fresh session"
                exit 1
              fi
            fi
            sleep 300
          done

      - name: Hand over to the next session
        # Dispatches the next fresh session while this job is still alive, so
        # the chain continues with almost no dead time.
        if: ${{ always() && inputs.keep-alive != 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const me    = Number('${{ github.run_id }}');
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // Live-Desktop check that excludes THIS run. No server side
            // workflow_id filter - GitHub ignores it for file names; always
            // filter on the workflow name instead.
            const otherLiveDesktops = async () => {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 30
              });
              return data.workflow_runs.filter(
                r => r.name === 'Desktop' && r.id !== me &&
                     (r.status === 'in_progress' || r.status === 'queued'));
            };

            for (let attempt = 1; attempt <= 5; attempt++) {
              if ((await otherLiveDesktops()).length > 0) {
                core.info('Another Desktop session is already live (' + (await otherLiveDesktops()).map(r => r.run_number).join(', ') + '). Not dispatching.');
                return;
              }
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'desktop.yml',
                  ref: context.ref,
                  inputs: { 'keep-alive': String('${{ inputs.keep-alive }}') }
                });
              } catch (e) {
                core.warning('dispatch attempt ' + attempt + ' failed: ' + e.message);
                await sleep(15000);
                continue;
              }
              // Verify the dispatch actually produced a run.
              for (let w = 0; w < 12; w++) {
                await sleep(10000);
                const fresh = await otherLiveDesktops();
                if (fresh.length > 0) {
                  core.info('Next fresh Desktop session is live: #' + fresh.map(r => r.run_number).join(', '));
                  return;
                }
              }
              core.warning('dispatch did not start a run, retrying');
            }
            core.setFailed('Could not dispatch the next Desktop session.');
